[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.taskipy.tasks]
lint = 'ruff check .'
lint_fix = 'ruff check . --fix'
format = 'ruff format && ruff check . --fix'
run = 'fastapi dev app/app.py'

